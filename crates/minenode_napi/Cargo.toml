
[package]
edition = "2024"
name = "minenode_napi"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.0.0", features = ["async"] }
napi-derive = "3.0.0"
minenode = { path = "../minenode" }
anyhow = { workspace = true }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
